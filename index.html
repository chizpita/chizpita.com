<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chizpita</title>
<meta name="description" content="Chizpita — pockets de queso hechos a mano. Muy pronto podrás pedir aquí.">
<meta property="og:type" content="website">
<meta property="og:title" content="Chizpita">
<meta property="og:description" content="Pockets de queso hechos a mano. Muy pronto podrás pedir aquí.">
<meta property="og:url" content="https://chizpita.com/">
<meta name="theme-color" content="#F4B63A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Shrikhand&display=swap" rel="stylesheet">
<style>
  :root { --gold:#F4B63A; --bg:#FFFCF6; --ink:#3a2e1f; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:'Figtree',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  main { max-width:440px; }
  .dot { width:64px; height:64px; border-radius:50%; background:var(--gold); margin:0 auto 20px; }
  h1 {
    font-family:'Shrikhand',cursive; font-weight:400;
    font-size:clamp(3rem,16vw,5rem); line-height:1; margin:0 0 12px; color:var(--gold);
    text-shadow:0 2px 0 rgba(58,46,31,.08);
  }
  p { font-size:1.125rem; line-height:1.5; margin:0 0 8px; }
  .soon { font-weight:600; }
  .bar { height:4px; width:56px; background:var(--gold); border-radius:2px; margin:20px auto 0; }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>Chizpita</h1>
  <p>Pockets de queso hechos a mano.</p>
  <p class="soon">Muy pronto podrás pedir aquí.</p>
  <div class="bar" aria-hidden="true"></div>
</main>
</body>
</html>
